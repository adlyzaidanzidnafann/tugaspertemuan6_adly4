
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px #0002;
        }

        h2 {
            text-align: center;
            color: #2459a9;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2459a9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #173f7a;
        }

        #hasil {
            margin-top: 20px;
            padding: 15px;
            background: #eef7ff;
            border-radius: 8px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Kalkulator Sederhana</h2>

        <label for="bil1">Bilangan Pertama</label>
        <input type="number" id="bil1"
               placeholder="Masukkan bilangan pertama"
               step="any">

        <label for="operator">Pilih Operator</label>
        <select id="operator">
            <option value="+">Penjumlahan (+)</option>
            <option value="-">Pengurangan (-)</option>
            <option value="*">Perkalian (*)</option>
            <option value="/">Pembagian (/)</option>
        </select>

        <label for="bil2">Bilangan Kedua</label>
        <input type="number" id="bil2"
               placeholder="Masukkan bilangan kedua"
               step="any">

        <button onclick="hitung()">Hitung</button>

        <div id="hasil">
            Hasil perhitungan akan muncul di sini.
        </div>
    </div>

    <script>
        function hitung() {
            let inputA = document.getElementById("bil1").value;
            let inputB = document.getElementById("bil2").value;
            let operator = document.getElementById("operator").value;
            let hasil = document.getElementById("hasil");

            if (inputA === "" || inputB === "") {
                hasil.innerHTML =
                    "Silakan masukkan kedua bilangan terlebih dahulu.";
                return;
            }

            let A = Number(inputA);
            let B = Number(inputB);
            let hasilHitung;

            switch (operator) {
                case "+":
                    hasilHitung = A + B;
                    break;

                case "-":
                    hasilHitung = A - B;
                    break;

                case "*":
                    hasilHitung = A * B;
                    break;

                case "/":
                    if (B === 0) {
                        hasil.innerHTML =
                            "Error: Bilangan tidak dapat dibagi dengan nol.";
                        return;
                    }
                    hasilHitung = A / B;
                    break;

                default:
                    hasil.innerHTML = "Operator tidak valid.";
                    return;
            }

            hasil.innerHTML =
                "<strong>Hasil Perhitungan</strong><br>" +
                A + " " + operator + " " + B +
                " = <strong>" + hasilHitung + "</strong>";
        }
    </script>

</body>
</html>
